[workspace]
default-members = ["cores3-core"]
members         = ["cores3", "cores3-core"]
resolver        = "3"

[workspace.package]
edition      = "2024"
rust-version = "1.88"
version      = "0.1.0"

[workspace.dependencies]
cores3-core = { path = "cores3-core", version = "0.1.0" }

embedded-graphics      = "0.8.2"
embedded-hal           = "1.0.0"
embedded-hal-bus       = "0.3.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal                = { version = "~1.1.0", features = ["esp32s3", "unstable"] }
mipidsi                = "0.10.0"

# only used by `cargo run-board`
[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
